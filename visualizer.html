<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,600&family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <title>STARMILK | Visual Listening Room</title>

  <meta name="theme-color" content="#080b14" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23c9944a'/%3E%3Cstop offset='50%25' stop-color='%236b5b8a'/%3E%3Cstop offset='100%25' stop-color='%234a5578'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35' fill='url(%23g)'/%3E%3C/svg%3E" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "STARMILK Visual Listening Room",
    "description": "Immersive visual listening experience — ambient visuals and audio-reactive art for the STARMILK music project.",
    "isPartOf": {
      "@type": "WebSite",
      "name": "STARMILK",
      "url": "https://starmilk.org/"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080b14;
      --bg-deep: #05070e;
      --glass: rgba(12, 16, 28, 0.72);
      --glass-border: rgba(242, 231, 208, 0.14);
      --purple: #7c6b9e;
      --gold: #d9aa4e;
      --gold-light: #f0cb7e;
      --gold-dim: rgba(217, 170, 78, 0.16);
      --text: #f2e7d0;
      --muted: rgba(242, 231, 208, 0.62);
      --muted-dim: rgba(242, 231, 208, 0.16);
      --font-display: "Cormorant Garamond", "DM Serif Display", Georgia, serif;
      --font-body: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      position: relative;
      cursor: none;
      -webkit-font-smoothing: antialiased;
    }
    body.controls-visible { cursor: default; }

    /* ── SVG noise filter for subtle organic film grain ── */
    .grain-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.035;
      mix-blend-mode: overlay;
    }

    /* ── Visual layers — Full-bleed edge-to-edge cover by default ── */
    .viz-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 2.2s cubic-bezier(.22, 1, .36, 1), transform 6s cubic-bezier(.22, 1, .36, 1);
      z-index: 0;
      pointer-events: none;
    }
    body.fit-contain .viz-layer {
      object-fit: contain;
      transform: scale(1);
    }
    .viz-layer.active {
      opacity: 1;
      transform: scale(1);
    }
    video.viz-layer { filter: saturate(0.84) contrast(1.04) brightness(0.92); }
    img.viz-layer { filter: saturate(0.86) contrast(1.04) brightness(0.9); }
    .viz-layer.void-bg { background: radial-gradient(circle at 50% 50%, #111729 0%, #05070e 75%); }

    /* ── Soft cinematic vignette ── */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 82% 82% at 50% 50%, transparent 38%, rgba(5, 7, 14, 0.68) 100%),
        linear-gradient(to bottom, rgba(5, 7, 14, 0.42) 0%, transparent 16%, transparent 82%, rgba(5, 7, 14, 0.72) 100%);
    }

    /* ── Audio-reactive canvas ── */
    #viz-reactive {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.72;
    }

    /* ── Ambient particles ── */
    #viz-particles {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* ── Top bar (back + title + fullscreen/fit actions) ── */
    .viz-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 1.25rem 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .55s cubic-bezier(.22, 1, .36, 1), transform .55s cubic-bezier(.22, 1, .36, 1);
    }
    .viz-topbar.hidden {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    .viz-pill-btn {
      color: var(--text);
      background: var(--glass);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      font-family: var(--font-body);
      font-size: .68rem;
      font-weight: 500;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-decoration: none;
      padding: .5rem .95rem;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      cursor: pointer;
      transition: color .25s, border-color .25s, background .25s, transform .2s;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .viz-pill-btn:hover {
      color: var(--gold-light);
      border-color: rgba(217, 170, 78, 0.55);
      background: rgba(20, 26, 42, 0.84);
      transform: translateY(-1px);
    }
    .viz-pill-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .viz-top-actions {
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .viz-logo {
      font-family: "Cinzel", var(--font-display); font-weight: 600; background: linear-gradient(180deg, #fffdf9 0%, #f0cb7e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
      font-size: .95rem;
      letter-spacing: .16em;
      color: var(--text);
      opacity: .75;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    /* ── Floating Glass Control Dock ── */
    .viz-ui {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      z-index: 10;
      width: min(520px, calc(100vw - 2rem));
      padding: 1.15rem 1.5rem 1.25rem;
      background: var(--glass);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      backdrop-filter: blur(24px) saturate(1.2);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      opacity: 1;
      transition: opacity .55s cubic-bezier(.22, 1, .36, 1), transform .55s cubic-bezier(.22, 1, .36, 1);
    }
    .viz-ui.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(16px);
      pointer-events: none;
    }

    .viz-header-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
    }

    .viz-label {
      font-size: .58rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: .88;
    }

    .viz-scene-name {
      font-size: .62rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Scene selector ── */
    .viz-scenes {
      display: flex;
      justify-content: center;
      gap: .6rem;
      flex-wrap: wrap;
    }

    .viz-scene-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid rgba(242, 231, 208, 0.2);
      cursor: pointer;
      transition: border-color .25s, transform .2s, box-shadow .25s;
      position: relative;
      touch-action: manipulation;
      background: #121827;
    }
    .viz-scene-dot:hover {
      border-color: rgba(217, 170, 78, 0.65);
      transform: scale(1.1);
    }
    .viz-scene-dot.active {
      border-color: var(--gold-light);
      box-shadow: 0 0 0 3px rgba(217, 170, 78, 0.22), 0 0 14px rgba(217, 170, 78, 0.4);
      transform: scale(1.08);
    }

    /* Scene dot colors */
    .viz-scene-dot[data-visual="vision"]    { background: linear-gradient(135deg, #231b42, #52377d); }
    .viz-scene-dot[data-visual="heart"]     { background: linear-gradient(135deg, #3b172e, #7d2b58); }
    .viz-scene-dot[data-visual="sun"]       { background: linear-gradient(135deg, #3d2c14, #8c6928); }
    .viz-scene-dot[data-visual="butterfly"] { background: linear-gradient(135deg, #152c42, #2b5c85); }
    .viz-scene-dot[data-visual="wings"]     { background: linear-gradient(135deg, #222236, #4b4b75); }
    .viz-scene-dot[data-visual="wizard"]    { background: linear-gradient(135deg, #1d293b, #3a4f6e); }
    .viz-scene-dot[data-visual="void"]      { background: radial-gradient(circle, #1b2238, #060810); }

    /* ── Track name ── */
    .viz-track-name {
      font-family: "Cinzel", var(--font-display); font-weight: 600; background: linear-gradient(180deg, #fffdf9 0%, #f0cb7e 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
      font-family: var(--font-display) !important; background: none !important; -webkit-background-clip: border-box !important; background-clip: border-box !important; color: var(--text) !important; font-size: 1.42rem; font-style: italic; text-shadow: 0 2px 18px rgba(217, 170, 78, 0.22);
      color: var(--text);
      text-align: center;
      letter-spacing: .01em;
      line-height: 1.2;
      min-height: 1.4em;
      font-weight: 400;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Progress indicator ── */
    .viz-progress-wrap {
      width: 100%;
      height: 5px;
      background: rgba(242, 231, 208, 0.12);
      border-radius: 999px;
      overflow: hidden;
      cursor: pointer;
      transition: height .2s;
    }
    .viz-progress-wrap:hover { height: 7px; }
    .viz-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 999px;
      transition: width .3s linear; } .viz-time-row { width: 100%; display: flex; justify-content: space-between; font-size: .66rem; font-variant-numeric: tabular-nums; letter-spacing: .06em; color: var(--muted); margin-top: -.35rem;
    }

    /* ── Transport controls ── */
    .viz-transport {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: .65rem;
    }

    .viz-transport-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      padding: .5rem;
      border-radius: 50%;
      transition: color .22s, background .22s, border-color .22s, transform .18s;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      width: 40px;
      height: 40px;
    }
    .viz-transport-btn:hover,
    .viz-transport-btn.active {
      color: var(--gold-light);
      background: rgba(217, 170, 78, 0.12);
      border-color: rgba(217, 170, 78, 0.28);
    }
    .viz-transport-btn:active { transform: scale(.93); }
    .viz-transport-btn svg { width: 18px; height: 18px; }
    .viz-transport-btn.play-btn {
      color: #0b0e18;
      background: var(--gold);
      border: 1px solid var(--gold-light);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      box-shadow: 0 6px 20px rgba(217, 170, 78, 0.35);
    }
    .viz-transport-btn.play-btn svg { width: 20px; height: 20px; }
    .viz-transport-btn.play-btn:hover {
      background: var(--gold-light);
      color: #0b0e18;
      transform: scale(1.04);
    }

    /* ── Hidden SC player ── */
    .viz-sc-hidden {
      position: fixed;
      bottom: -200px;
      left: -9999px;
      width: 300px;
      height: 166px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }
    .viz-sc-hidden iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ── Tap hint ── */
    .viz-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      text-align: center;
      opacity: 0;
      transition: opacity .8s ease;
      pointer-events: none;
      background: rgba(8, 11, 20, 0.65);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      padding: .55rem 1.1rem;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
    }
    .viz-hint.show { opacity: 1; }
    .viz-hint p {
      font-size: .62rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text);
    }

    /* ── Focus styles ── */
    :focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 3px;
    }
    button:focus:not(:focus-visible),
    a:focus:not(:focus-visible) { outline: none; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .viz-topbar { padding: .85rem 1rem; }
      .viz-logo { display: none; }
      .viz-ui { bottom: .85rem; padding: .95rem 1.1rem 1.05rem; gap: .6rem; border-radius: 22px; }
      .viz-track-name { font-size: 1.02rem; }
      .viz-scene-dot { width: 24px; height: 24px; }
      .viz-pill-btn { font-size: .6rem; min-height: 34px; padding: .4rem .75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
  <script type="speculationrules">
  {"prefetch": [{"source": "document", "where": {"href_matches": "/*"}, "eagerness": "conservative"}]}
  </script>
</head>
<body>

  <!-- ═══ Visual Layers ═══ -->
  <video id="viz-vision" class="viz-layer active" loop muted playsinline>
    <source src="starmilk-vision.mp4" type="video/mp4" />
  </video>
  <video id="viz-heart" class="viz-layer" loop muted playsinline preload="none">
    <source src="cosmic-heart.mp4" type="video/mp4" />
  </video>
  <video id="viz-sun" class="viz-layer" loop muted playsinline preload="none">
    <source src="dripping-sun.mp4" type="video/mp4" />
  </video>
  <video id="viz-butterfly" class="viz-layer" loop muted playsinline preload="none">
    <source src="butterfly-infinity.mp4" type="video/mp4" />
  </video>
  <video id="viz-wings" class="viz-layer" loop muted playsinline preload="none">
    <source src="winged-ascension.mp4" type="video/mp4" />
  </video>
  <img id="viz-wizard" class="viz-layer" src="star-wizard.webp" alt="Star Wizard" width="1344" height="768" loading="lazy" decoding="async" />
  <div id="viz-void" class="viz-layer void-bg" role="presentation"></div>

  <!-- ═══ Vignette ═══ -->
  <div class="vignette" aria-hidden="true"></div>

  <!-- ═══ Audio-Reactive Canvas ═══ -->
  <canvas id="viz-reactive" aria-hidden="true"></canvas>

  <!-- ═══ Ambient Particles ═══ -->
  <canvas id="viz-particles" aria-hidden="true"></canvas>

  <!-- ═══ Paper Grain Texture (SVG noise) ═══ -->
  <svg class="grain-overlay" aria-hidden="true" width="100%" height="100%">
    <filter id="grain-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <rect width="100%" height="100%" filter="url(#grain-filter)" />
  </svg>

  <!-- ═══ Top Bar ═══ -->
  <div class="viz-topbar" id="viz-topbar">
    <a href="index.html" class="viz-pill-btn" aria-label="Back to main site">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Mothership
    </a>
    <span class="viz-logo" aria-hidden="true">STARMILK</span>
    <div class="viz-top-actions">
      <button type="button" class="viz-pill-btn" id="viz-fit-toggle" aria-label="Toggle video fit mode" title="Switch between Full-Bleed and Fit">
        <span id="viz-fit-label">Full Bleed</span>
      </button>
      <button type="button" class="viz-pill-btn" id="viz-fullscreen-btn" aria-label="Enter fullscreen" title="Fullscreen (F)">
        <svg id="viz-fs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span id="viz-fs-label">Fullscreen</span>
      </button>
    </div>
  </div>

  <!-- ═══ Tap Hint ═══ -->
  <div class="viz-hint" id="viz-hint" aria-hidden="true">
    <p>Move cursor or tap to reveal controls &bull; Press F for fullscreen</p>
  </div>

  <!-- ═══ Floating Glass Controls UI ═══ -->
  <div class="viz-ui" id="viz-ui" role="region" aria-label="Visualizer controls">

    <div class="viz-header-row">
      <span class="viz-label">Visual Listening Room</span>
      <span class="viz-scene-name" id="viz-scene-name">Chalice Dance</span>
    </div>

    <!-- Scene Selector -->
    <div class="viz-scenes" role="radiogroup" aria-label="Visual scene selection">
      <button class="viz-scene-dot active" data-visual="vision" data-label="Chalice Dance" role="radio" aria-checked="true" aria-label="Chalice Dance" title="Chalice Dance"></button>
      <button class="viz-scene-dot" data-visual="heart" data-label="Cosmic Heart" role="radio" aria-checked="false" aria-label="Cosmic Heart" title="Cosmic Heart"></button>
      <button class="viz-scene-dot" data-visual="sun" data-label="Dripping Sun" role="radio" aria-checked="false" aria-label="Dripping Sun" title="Dripping Sun"></button>
      <button class="viz-scene-dot" data-visual="butterfly" data-label="Butterfly Infinity" role="radio" aria-checked="false" aria-label="Butterfly Infinity" title="Butterfly Infinity"></button>
      <button class="viz-scene-dot" data-visual="wings" data-label="Winged Ascension" role="radio" aria-checked="false" aria-label="Winged Ascension" title="Winged Ascension"></button>
      <button class="viz-scene-dot" data-visual="wizard" data-label="Star Wizard" role="radio" aria-checked="false" aria-label="Star Wizard" title="Star Wizard"></button>
      <button class="viz-scene-dot" data-visual="void" data-label="Deep Void" role="radio" aria-checked="false" aria-label="Deep Void" title="Deep Void"></button>
    </div>

    <!-- Track Name -->
    <p class="viz-track-name" id="viz-track-name" aria-live="polite">Loading catalog…</p>

    <!-- Progress -->
    <div class="viz-progress-wrap" id="viz-progress-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Track progress">
      <div class="viz-progress-bar" id="viz-progress-bar"></div></div><div class="viz-time-row"><span id="viz-time-cur">0:00</span><span id="viz-time-dur">--:--</span></div>

    <!-- Transport -->
    <div class="viz-transport" role="toolbar" aria-label="Playback controls">
      <button class="viz-transport-btn" id="viz-shuffle" aria-label="Shuffle tracks" title="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"/>
          <line x1="4" y1="20" x2="21" y2="3"/>
          <polyline points="21 16 21 21 16 21"/>
          <line x1="15" y1="15" x2="21" y2="21"/>
          <line x1="4" y1="4" x2="9" y2="9"/>
        </svg>
      </button>
      <button class="viz-transport-btn" id="viz-prev" aria-label="Previous track" title="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none" opacity=".85"/>
          <line x1="5" y1="19" x2="5" y2="5"/>
        </svg>
      </button>
      <button class="viz-transport-btn play-btn" id="viz-play" aria-label="Play" title="Play / Pause (Space)">
        <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="7 4 20 12 7 20 7 4"/>
        </svg>
      </button>
      <button class="viz-transport-btn" id="viz-next" aria-label="Next track" title="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none" opacity=".85"/>
          <line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
      </button>
      <button class="viz-transport-btn" id="viz-loop" aria-label="Loop track" aria-pressed="false" title="Loop current track">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"/>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ═══ Hidden SoundCloud Player ═══ -->
  <div class="viz-sc-hidden" id="viz-sc-container" aria-hidden="true">
    <div id="viz-sc-embed"></div>
  </div>

  <script>
  (function() {
    'use strict';

    const SC_API_URL = 'https://w.soundcloud.com/player/api.js';
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const TAU = Math.PI * 2;

    let scAPILoaded = false;
    let scWidget = null;
    let tracks = [];
    let currentIndex = 0;
    let isPlaying = false;
    let isLooping = false;
    let progressPoll = null;

    const ui = document.getElementById('viz-ui');
    const topbar = document.getElementById('viz-topbar');
    const hint = document.getElementById('viz-hint');
    const trackNameEl = document.getElementById('viz-track-name');
    const sceneNameEl = document.getElementById('viz-scene-name');
    const scEmbed = document.getElementById('viz-sc-embed');
    const playBtn = document.getElementById('viz-play');
    const playIcon = document.getElementById('play-icon');
    const loopBtn = document.getElementById('viz-loop');
    const progressBar = document.getElementById('viz-progress-bar');
    const progressWrap = document.getElementById('viz-progress-wrap');
    const fullscreenBtn = document.getElementById('viz-fullscreen-btn');
    const fsLabel = document.getElementById('viz-fs-label');
    const fitToggleBtn = document.getElementById('viz-fit-toggle');
    const fitLabel = document.getElementById('viz-fit-label');

    const layers = {
      vision:    document.getElementById('viz-vision'),
      heart:     document.getElementById('viz-heart'),
      sun:       document.getElementById('viz-sun'),
      butterfly: document.getElementById('viz-butterfly'),
      wings:     document.getElementById('viz-wings'),
      wizard:    document.getElementById('viz-wizard'),
      void:      document.getElementById('viz-void')
    };
    const videoKeys = ['vision', 'heart', 'sun', 'butterfly', 'wings'];
    let currentVisual = 'vision';

    layers.vision.play().catch(() => {});

    /* ── Fullscreen & Fit Toggles ── */
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        document.exitFullscreen?.().catch(() => {});
      }
    }
    fullscreenBtn?.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => {
      const isFs = Boolean(document.fullscreenElement);
      if (fsLabel) fsLabel.textContent = isFs ? 'Exit Fullscreen' : 'Fullscreen';
      fullscreenBtn?.setAttribute('aria-label', isFs ? 'Exit fullscreen' : 'Enter fullscreen');
    });

    fitToggleBtn?.addEventListener('click', () => {
      const contain = document.body.classList.toggle('fit-contain');
      if (fitLabel) fitLabel.textContent = contain ? 'Contained' : 'Full Bleed';
    });

    /* ── SC API Loader ── */
    const loadSCAPI = () => new Promise((resolve) => {
      if (scAPILoaded && typeof SC !== 'undefined' && SC.Widget) { resolve(true); return; }
      const s = document.createElement('script');
      s.src = SC_API_URL;
      s.onload = () => { scAPILoaded = true; resolve(true); };
      s.onerror = () => resolve(false);
      document.head.appendChild(s);
    });

    /* ── Visual Scene Switching ── */
    document.querySelectorAll('.viz-scene-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        const target = dot.dataset.visual;
        if (target === currentVisual) return;

        videoKeys.forEach(k => { layers[k].pause(); layers[k].classList.remove('active'); });
        layers.wizard.classList.remove('active');
        layers.void.classList.remove('active');

        document.querySelectorAll('.viz-scene-dot').forEach(d => {
          d.classList.remove('active');
          d.setAttribute('aria-checked', 'false');
        });

        layers[target].classList.add('active');
        dot.classList.add('active');
        dot.setAttribute('aria-checked', 'true');
        if (sceneNameEl) sceneNameEl.textContent = dot.dataset.label || '';
        currentVisual = target;

        if (videoKeys.includes(target)) {
          layers[target].play().catch(() => {});
        }
      });
    });

    /* ── UI Show/Hide — 5s idle fade ── */
    let uiVisible = true;
    let hideTimer = null;

    function showUI() {
      ui.classList.remove('hidden');
      topbar.classList.remove('hidden');
      document.body.classList.add('controls-visible');
      uiVisible = true;
      scheduleHide();
    }

    function hideUI() {
      ui.classList.add('hidden');
      topbar.classList.add('hidden');
      document.body.classList.remove('controls-visible');
      uiVisible = false;
      hint.classList.add('show');
      setTimeout(() => hint.classList.remove('show'), 2000);
    }

    function scheduleHide() {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideUI, 5000);
    }

    let lastMoveTime = 0;
    document.addEventListener('mousemove', () => {
      const now = Date.now();
      if (now - lastMoveTime < 100) return;
      lastMoveTime = now;
      if (!uiVisible) showUI();
      else scheduleHide();
    });

    document.addEventListener('touchstart', (e) => {
      if (e.target.closest('.viz-ui') || e.target.closest('.viz-topbar')) return;
      if (uiVisible) hideUI();
      else showUI();
    }, { passive: true });

    document.addEventListener('click', (e) => {
      if (e.target.closest('.viz-ui') || e.target.closest('.viz-topbar')) return;
      if (uiVisible) hideUI();
      else showUI();
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.closest('input,textarea')) return;
      if (e.key === 'Escape') {
        if (uiVisible) hideUI(); else showUI();
      } else if (e.key === ' ') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'ArrowRight') {
        loadTrack(currentIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        loadTrack(currentIndex - 1);
      }
    });

    scheduleHide();

    /* ── Music Player ── */
    function setPlayIcon(playing) {
      playIcon.innerHTML = playing
        ? '<path d="M6 4H10V20H6Z" /><path d="M14 4H18V20H14Z" />'
        : '<polygon points="7 4 20 12 7 20 7 4"/>';
      playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    }

    function togglePlayPause() {
      if (!scWidget) return;
      if (isPlaying) {
        scWidget.pause();
        isPlaying = false;
        setPlayIcon(false);
        stopProgressPoll();
      } else {
        scWidget.play();
        isPlaying = true;
        setPlayIcon(true);
        startProgressPoll();
      }
    }

    function startProgressPoll() {
      stopProgressPoll();
      progressPoll = setInterval(() => {
        if (!scWidget) return;
        scWidget.getPosition(pos => {
          scWidget.getDuration(dur => {
            if (dur > 0) {
              const pct = Math.min(100, (pos / dur) * 100);
              progressBar.style.width = pct + '%';
              progressWrap.setAttribute('aria-valuenow', String(Math.round(pct))); const fmt = ms => { const s = Math.max(0, Math.floor((ms || 0) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }; const tC = document.getElementById('viz-time-cur'), tD = document.getElementById('viz-time-dur'); if (tC) tC.textContent = fmt(pos); if (tD) tD.textContent = fmt(dur);
            }
          });
        });
      }, 400);
    }

    function stopProgressPoll() {
      if (progressPoll) { clearInterval(progressPoll); progressPoll = null; }
    }

    progressWrap.addEventListener('click', (e) => {
      if (!scWidget) return;
      const rect = progressWrap.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      scWidget.getDuration(dur => {
        scWidget.seekTo(dur * pct);
      });
    });

    fetch('starmilk-tracks.json')
      .then(r => r.json())
      .then(data => {
        tracks = data;
        for (let i = tracks.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
        }
        loadTrack(0);
      })
      .catch(() => { trackNameEl.textContent = 'Could not load tracks'; });

    async function loadTrack(index) {
      if (!tracks.length) return;
      currentIndex = ((index % tracks.length) + tracks.length) % tracks.length;
      const track = tracks[currentIndex];
      const name = track.name || track.title || 'Unknown Track';
      trackNameEl.textContent = name;
      progressBar.style.width = '0%';

      const url = track.url || track.permalink_url;
      if (!url) return;

      const encoded = encodeURIComponent(url);
      const autoPlay = isPlaying ? 'true' : 'false';
      scEmbed.innerHTML = `<iframe
        scrolling="no" frameborder="no" allow="autoplay"
        title="Now playing: ${name.replace(/"/g, '&quot;')}"
        src="https://w.soundcloud.com/player/?url=${encoded}&color=%23d9aa4e&auto_play=${autoPlay}&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
      ></iframe>`;

      const iframe = scEmbed.querySelector('iframe');
      if (!iframe) return;

      try {
        await loadSCAPI();
        if (typeof SC === 'undefined' || !SC.Widget) return;
        scWidget = SC.Widget(iframe);

        scWidget.bind(SC.Widget.Events.READY, () => {
          if (isPlaying) {
            scWidget.play();
            startProgressPoll();
          }
        });

        scWidget.bind(SC.Widget.Events.PLAY, () => {
          isPlaying = true;
          setPlayIcon(true);
          startProgressPoll();
        });

        scWidget.bind(SC.Widget.Events.PAUSE, () => {
          isPlaying = false;
          setPlayIcon(false);
          stopProgressPoll();
        });

        scWidget.bind(SC.Widget.Events.FINISH, () => {
          stopProgressPoll();
          if (isLooping && scWidget) {
            progressBar.style.width = '0%';
            scWidget.seekTo(0);
            scWidget.play();
            startProgressPoll();
            return;
          }
          progressBar.style.width = '100%';
          setTimeout(() => loadTrack(currentIndex + 1), 600);
        });

        scWidget.bind(SC.Widget.Events.ERROR, () => {
          setTimeout(() => loadTrack(currentIndex + 1), 1200);
        });
      } catch (_) {}
    }

    playBtn.addEventListener('click', togglePlayPause);
    document.getElementById('viz-prev').addEventListener('click', () => loadTrack(currentIndex - 1));
    document.getElementById('viz-next').addEventListener('click', () => loadTrack(currentIndex + 1));
    document.getElementById('viz-shuffle').addEventListener('click', () => {
      for (let i = tracks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [tracks[i], tracks[j]] = [tracks[j], tracks[i]];
      }
      loadTrack(0);
    });
    loopBtn?.addEventListener('click', () => {
      isLooping = !isLooping;
      loopBtn.classList.toggle('active', isLooping);
      loopBtn.setAttribute('aria-pressed', String(isLooping));
    });

    /* ── Ambient Particles ── */
    const pCanvas = document.getElementById('viz-particles');
    const pCtx = pCanvas.getContext('2d');
    let PW, PH, motes;

    function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }

    function buildMotes() {
      PW = pCanvas.width = window.innerWidth;
      PH = pCanvas.height = window.innerHeight;
      const count = Math.min(45, Math.floor(PW * 0.028));
      motes = Array.from({ length: count }, () => ({
        x: rnd(0, PW), y: rnd(0, PH),
        r: rnd(0.4, 1.8),
        alpha: rnd(0.08, 0.35),
        speed: rnd(0.00015, 0.0006),
        phase: rnd(0, TAU),
        dx: rnd(-0.08, 0.08),
        dy: rnd(-0.04, 0.04),
        color: Math.random() > 0.7
          ? `217,170,78`
          : Math.random() > 0.5
            ? `124,107,158`
            : `242,231,208`
      }));
    }

    buildMotes();
    window.addEventListener('resize', buildMotes);

    if (REDUCED) {
      pCtx.clearRect(0, 0, PW, PH);
      motes.forEach(p => {
        pCtx.beginPath();
        pCtx.arc(p.x, p.y, p.r, 0, TAU);
        pCtx.fillStyle = `rgba(${p.color},${p.alpha * 0.4})`;
        pCtx.fill();
      });
    }

    /* ── Audio-Reactive Visualization ── */
    const rCanvas = document.getElementById('viz-reactive');
    const rCtx = rCanvas.getContext('2d');
    let RW, RH;

    function sizeReactiveCanvas() {
      RW = rCanvas.width = window.innerWidth;
      RH = rCanvas.height = window.innerHeight;
    }
    sizeReactiveCanvas();
    window.addEventListener('resize', sizeReactiveCanvas);

    const NUM_BANDS = 64;
    let audioData = new Float32Array(NUM_BANDS);

    function updateDummyAudio(time) {
      for (let i = 0; i < NUM_BANDS; i++) {
        const freq = i / NUM_BANDS;
        const base = Math.sin(time * 0.0004 + i * 0.3) * 0.3;
        const mid = Math.sin(time * 0.0007 + i * 0.15) * 0.25;
        const slow = Math.sin(time * 0.00015 + i * 0.5) * 0.2;
        const pulse = Math.sin(time * 0.0012) * 0.15;
        const emphasis = 1 - freq * 0.4;
        audioData[i] = Math.max(0, (base + mid + slow + pulse) * emphasis * (isPlaying ? 1.0 : 0.35));
      }
    }

    const ringCount = 5;
    const rings = Array.from({ length: ringCount }, (_, i) => ({
      radius: 80 + i * 55,
      points: 90 + i * 20,
      speed: 0.0001 + i * 0.00003,
      amplitude: 12 + i * 8,
      phase: i * 1.2,
      color: i % 2 === 0
        ? { r: 217, g: 170, b: 78 }
        : { r: 124, g: 107, b: 158 }
    }));

    const reactiveParticleCount = 35;
    const reactiveParticles = Array.from({ length: reactiveParticleCount }, () => ({
      angle: rnd(0, TAU),
      dist: rnd(60, 280),
      size: rnd(1.5, 4),
      speed: rnd(0.0001, 0.0004),
      band: Math.floor(rnd(0, NUM_BANDS)),
      phase: rnd(0, TAU),
      trail: [],
      color: Math.random() > 0.5
        ? { r: 217, g: 170, b: 78 }
        : { r: 124, g: 107, b: 158 }
    }));

    if (!REDUCED) {
      (function animate(time) {
        requestAnimationFrame(animate);
        updateDummyAudio(time);

        pCtx.clearRect(0, 0, PW, PH);
        motes.forEach(p => {
          p.x += p.dx;
          p.y += p.dy;
          if (p.x < -3) p.x = PW + 3;
          if (p.x > PW + 3) p.x = -3;
          if (p.y < -3) p.y = PH + 3;
          if (p.y > PH + 3) p.y = -3;
          const twinkle = p.alpha * (0.5 + 0.5 * Math.sin(time * p.speed + p.phase));
          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.r, 0, TAU);
          pCtx.fillStyle = `rgba(${p.color},${twinkle})`;
          pCtx.fill();
        });

        rCtx.clearRect(0, 0, RW, RH);
        const cx = RW / 2;
        const cy = RH / 2;

        rings.forEach((ring, ri) => {
          const bandStart = Math.floor((ri / ringCount) * NUM_BANDS * 0.6);
          rCtx.beginPath();
          for (let i = 0; i <= ring.points; i++) {
            const t = i / ring.points;
            const angle = t * TAU;
            const bandIdx = Math.min(NUM_BANDS - 1, bandStart + Math.floor(t * (NUM_BANDS * 0.3)));
            const audioVal = audioData[bandIdx];
            const noise1 = Math.sin(angle * 3 + time * ring.speed + ring.phase) * ring.amplitude * 0.5;
            const noise2 = Math.sin(angle * 7 + time * ring.speed * 0.6) * ring.amplitude * 0.3;
            const noise3 = Math.sin(angle * 2 + time * ring.speed * 1.5 + ri) * ring.amplitude * 0.2;
            const audioDisplace = audioVal * ring.amplitude * 2.5;
            const r = ring.radius + noise1 + noise2 + noise3 + audioDisplace;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;
            if (i === 0) rCtx.moveTo(x, y);
            else rCtx.lineTo(x, y);
          }
          rCtx.closePath();
          const alpha = 0.06 + audioData[bandStart] * 0.08;
          rCtx.strokeStyle = `rgba(${ring.color.r},${ring.color.g},${ring.color.b},${alpha})`;
          rCtx.lineWidth = 1.5 + audioData[bandStart] * 3;
          rCtx.stroke();
          const fillAlpha = 0.008 + audioData[bandStart] * 0.015;
          rCtx.fillStyle = `rgba(${ring.color.r},${ring.color.g},${ring.color.b},${fillAlpha})`;
          rCtx.fill();
        });

        reactiveParticles.forEach(p => {
          const audioVal = audioData[p.band];
          p.angle += p.speed + audioVal * 0.002;
          const wobble = Math.sin(time * 0.0002 + p.phase) * 30;
          const distMod = p.dist + audioVal * 40 + wobble;
          const x = cx + Math.cos(p.angle) * distMod;
          const y = cy + Math.sin(p.angle) * distMod * 0.75;
          p.trail.push({ x, y });
          if (p.trail.length > 8) p.trail.shift();
          if (p.trail.length > 1) {
            rCtx.beginPath();
            rCtx.moveTo(p.trail[0].x, p.trail[0].y);
            for (let ti = 1; ti < p.trail.length; ti++) {
              rCtx.lineTo(p.trail[ti].x, p.trail[ti].y);
            }
            const trailAlpha = 0.03 + audioVal * 0.06;
            rCtx.strokeStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${trailAlpha})`;
            rCtx.lineWidth = p.size * 0.5;
            rCtx.stroke();
          }
          const particleAlpha = 0.1 + audioVal * 0.25;
          const particleSize = p.size + audioVal * 2;
          rCtx.beginPath();
          rCtx.arc(x, y, particleSize, 0, TAU);
          rCtx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${particleAlpha})`;
          rCtx.fill();
        });

        const breathe = 0.5 + 0.5 * Math.sin(time * 0.0003);
        const avgAudio = audioData.reduce((s, v) => s + v, 0) / NUM_BANDS;
        const glowRadius = 120 + breathe * 60 + avgAudio * 100;
        const glowAlpha = 0.015 + avgAudio * 0.02;
        const glow = rCtx.createRadialGradient(cx, cy, 0, cx, cy, glowRadius);
        glow.addColorStop(0, `rgba(217,170,78,${glowAlpha})`);
        glow.addColorStop(0.5, `rgba(124,107,158,${glowAlpha * 0.5})`);
        glow.addColorStop(1, 'rgba(8,11,20,0)');
        rCtx.fillStyle = glow;
        rCtx.fillRect(cx - glowRadius, cy - glowRadius, glowRadius * 2, glowRadius * 2);
      })(0);
    }

  })();
  </script>
</body>
